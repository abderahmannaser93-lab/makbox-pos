<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>MAK BOX Siparis</title><script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script></head><body style="background:#111;color:#fff;font-family:sans-serif;margin:0"><div id="app" style="padding:20px"><h1 style="color:#D32F2F">MAK BOX</h1><p id="status">Yukleniyor...</p><div id="cats" style="display:flex;gap:8px;flex-wrap:wrap;margin:16px 0"></div><div id="items" style="display:grid;grid-template-columns:1fr 1fr;gap:12px"></div></div><script>const B=location.origin,P=new URLSearchParams(location.search),TID=parseInt(P.get('table')||'1');document.title='MAK BOX - Masa '+TID;let MENU=null,cart=[];async function load(){document.getElementById('status').textContent='Menu yukleniyor...';for(let i=0;i<10;i++){try{const r=await fetch(B+'/api/menu',{cache:'no-store'});if(!r.ok)throw 0;MENU=await r.json();document.getElementById('status').textContent='';renderCats();renderItems(MENU.categories[0].id);return;}catch(e){await new Promise(r=>setTimeout(r,2000));}}document.getElementById('status').innerHTML='<span style="color:red">Hata!</span> <button onclick="load()">Tekrar</button>';}function renderCats(){document.getElementById('cats').innerHTML=MENU.categories.map(c=>`<button onclick="renderItems('${c.id}')" style="background:#D32F2F;color:#fff;border:none;border-radius:20px;padding:8px 16px;cursor:pointer;font-weight:700">${c.name}</button>`).join('');}function renderItems(cat){const items=MENU.items.filter(i=>i.category===cat);document.getElementById('items').innerHTML=items.map(item=>{const p=item.sizes.orta||item.sizes.tek||0;return`<div style="background:#222;border-radius:12px;padding:12px;border:2px solid #333"><div style="font-weight:800;font-size:14px">${item.name}</div><div style="font-size:11px;color:#888;margin:4px 0">${item.desc||''}</div><div style="color:#D32F2F;font-weight:900;font-size:16px">${p} TL</div><button onclick="addCart('${item.id}','${item.name}',${p})" style="width:100%;background:#D32F2F;color:#fff;border:none;border-radius:8px;padding:8px;margin-top:8px;font-weight:800;cursor:pointer">+ Ekle</button></div>`;}).join('');}function addCart(id,name,price){cart.push({itemId:id,itemName:name,size:'orta',quantity:1,extras:[],note:'',lineTotal:price});const t=cart.reduce((s,c)=>s+c.lineTotal,0);if(confirm(name+' eklendi!\nSepet: '+t+' TL\n\nSiparis vermek ister misiniz?')){placeOrder();}}async function placeOrder(){try{const r=await fetch(B+'/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tableId:TID,items:cart,note:''})});if(!r.ok)throw new Error((await r.json()).error);cart=[];alert('Siparisuniz alindi!');}catch(e){alert('Hata: '+e.message);}}load();</script></body></html>
